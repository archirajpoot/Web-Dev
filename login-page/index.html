<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Signup Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .container{
      width:350px;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 8px 20px rgba(0,0,0,0.2);
    }

    .form-box{
      margin-bottom:40px;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    .input-box{
      margin-bottom:15px;
    }

    .input-box label{
      display:block;
      margin-bottom:5px;
      color:#555;
      font-size:14px;
    }

    .input-box input{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:5px;
      outline:none;
      transition:0.3s;
    }

    .input-box input:focus{
      border-color:#4facfe;
    }

    button{
      width:100%;
      padding:10px;
      border:none;
      background:#4facfe;
      color:white;
      font-size:16px;
      border-radius:5px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#00c6ff;
    }

    .text{
      text-align:center;
      margin-top:10px;
      font-size:13px;
      color:#666;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- SIGNUP FORM -->
    <div class="form-box">
      <h2>Sign Up</h2>

      <form>
        <div class="input-box">
          <label>Name</label>
          <input type="text" placeholder="Enter your name">
        </div>

        <div class="input-box">
          <label>Email</label>
          <input type="email" placeholder="Enter your email">
        </div>

        <div class="input-box">
          <label>Password</label>
          <input type="password" placeholder="Create password">
        </div>

        <button type="submit">Sign Up</button>
      </form>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-box">
      <h2>Login</h2>

      <form>
        <div class="input-box">
          <label>Email</label>
          <input type="email" placeholder="Enter your email">
        </div>

        <div class="input-box">
          <label>Password</label>
          <input type="password" placeholder="Enter password">
        </div>

        <button type="submit">Login</button>
      </form>

      <p class="text">Welcome Back 👋</p>
    </div>

  </div>

</body>
</html>
