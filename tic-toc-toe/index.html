<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#1f2937;
    }

    .container{
      text-align:center;
    }

    h1{
      color:white;
      margin-bottom:20px;
      font-size:40px;
    }

    .board{
      display:grid;
      grid-template-columns:repeat(3,120px);
      gap:10px;
    }

    .cell{
      width:120px;
      height:120px;
      border:none;
      border-radius:15px;
      background:white;
      font-size:50px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .cell:hover{
      background:#dbeafe;
      transform:scale(1.05);
    }

    .status{
      color:white;
      margin-top:20px;
      font-size:24px;
    }

    .reset-btn{
      margin-top:20px;
      padding:12px 25px;
      border:none;
      border-radius:10px;
      background:#22c55e;
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    .reset-btn:hover{
      background:#16a34a;
    }
  </style>
</head>

<body>
  
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="board">
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>

      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>

      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
    </div>

    <div class="status">Player X Turn</div>

    <button class="reset-btn">Reset Game</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
